# Every PR push builds a prerelease "v<ModuleVersion>" (from src-plugin/Plugin/PluginManifest.cs)
# with install zips; a new push to the same PR replaces it. On merge, a plain X.Y.Z version is
# promoted to the latest full release (the exact build that was tested), and so is a release candidate (-rc.N)
# so servers that install "latest" can get it; -alpha.N / -beta.N stay prereleases.
name: PR build

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  PR: ${{ github.event.pull_request.number }}
  SHA: ${{ github.event.pull_request.head.sha }}
  VERSION_RE: 'ModuleVersion => "\K[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?'

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      # Build the PR head itself (not GitHub's merge commit) so the release matches its tag
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - name: Version
        id: version
        run: |
          TAG="v$(grep -oP "$VERSION_RE" src-plugin/Plugin/PluginManifest.cs)"
          # An existing release for this tag must come from this PR, otherwise someone forgot to bump
          if BODY=$(gh release view "$TAG" --json body --jq .body 2>/dev/null) && ! grep -q "from #$PR\.$" <<<"$BODY"; then
            echo "::error::$TAG already belongs to another PR. Bump ModuleVersion in src-plugin/Plugin/PluginManifest.cs."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: |
          dotnet publish src-plugin/alerena.csproj -c Release
          dotnet publish src-botsplugin/alerena-bots.csproj -c Release

      # The in-game menus need CSSUniversalMenuAPI plus a driver; ship pinned releases so one zip installs everything
      - name: Bundle menu plugins
        run: |
          OUT=src-plugin/bin/alerena
          bundle() { # repo tag zip folder-in-zip
            gh release download "$2" --repo "CSGALS/$1" --pattern "$3" --dir menus
            unzip -q -o "menus/$3" -d menus/out
            gh api "repos/CSGALS/$1/contents/LICENSE?ref=$2" -H "Accept: application/vnd.github.raw" > "menus/out/addons/counterstrikesharp/$4/LICENSE"
          }
          bundle CSSUniversalMenuAPI v0.5.0 CSSUniversalMenuAPI.zip shared/CSSUniversalMenuAPI
          bundle SharpModMenu v0.2.8 SharpModMenu.zip plugins/SharpModMenu
          cp -r menus/out/addons/counterstrikesharp/. "$OUT/"

      - name: Test
        run: for test in tests/*.cs; do dotnet run "$test"; done

      # One package: the bots addon is part of the gamemode (an odd player out gets a bot)
      - name: Zip
        run: |
          cp -r src-botsplugin/bin/alerena-bots/. src-plugin/bin/alerena/
          (cd src-plugin/bin/alerena && zip -qr "$GITHUB_WORKSPACE/alerena.zip" .)

      - name: Release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" alerena.zip \
            --prerelease --target "$SHA" \
            --title "$TAG: $PR_TITLE" \
            --notes "Extract into \`addons/counterstrikesharp/\` on the server.

          Test build of ${SHA::7} from #$PR."

  promote:
    if: github.event.action == 'closed' && github.event.pull_request.merged
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - name: Mark release as latest (stable and release candidates)
        run: |
          TAG="v$(grep -oP "$VERSION_RE" src-plugin/Plugin/PluginManifest.cs)"
          if [[ "$TAG" == *-* && "$TAG" != *-rc.* ]]; then
            echo "$TAG is a pre-release version, leaving it as a prerelease."
          else
            gh release edit "$TAG" --prerelease=false --latest
          fi
